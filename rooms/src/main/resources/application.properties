server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/rooms
spring.datasource.username=rooms
spring.datasource.password=rooms

spring.jpa.hibernate.ddl-auto=validate

# Keycloak выдаёт JWT, :rooms сам проверяет его подпись по публичному набору ключей
# (JWKS) Keycloak. Spring Security сам находит адрес JWKS через
# OIDC-discovery по этому issuer-uri (запрашивает
# http://localhost:8180/realms/happynoizzzyrooms/.well-known/openid-configuration
# и берёт оттуда актуальный адрес ключей.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/happynoizzzyrooms
