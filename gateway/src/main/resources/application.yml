server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Логин теперь прямо в Keycloak (localhost:8180), не через gateway —
            # отдельного /api/auth/**-маршрута больше нет.
            - id: users-api
              uri: http://localhost:8083
              predicates:
                - Path=/api/users/**
            - id: rooms-api
              uri: http://localhost:8081
              predicates:
                - Path=/api/rooms/**

# Keycloak — единственный эмитент токенов. Gateway (как и :users/:rooms отдельно
# от него) только проверяет подпись по его JWKS, сам токены не выпускает.
app:
  jwt:
    jwk-set-uri: http://localhost:8180/realms/happynoizzzyrooms/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
