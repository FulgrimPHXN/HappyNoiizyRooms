server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: users-auth
              uri: http://localhost:8083
              predicates:
                - Path=/api/auth/**
            - id: users-api
              uri: http://localhost:8083
              predicates:
                - Path=/api/users/**
            - id: rooms-api
              uri: http://localhost:8081
              predicates:

                - Path=/api/rooms/**

app:
  jwt:
    secret: v2YSr9p15LCrvF1ftR8X7mC0jfWSdy8nOk95s6WZAvI=

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
