global:

  scrape_interval: 15s

scrape_configs:

  - job_name: users

    metrics_path: /actuator/prometheus

    static_configs:
      - targets:

          # Приложения работают на хосте, Prometheus — в контейнере.
          - host.docker.internal:8083

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
