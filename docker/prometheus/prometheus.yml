# Глобальные настройки — применяются ко всем job'ам ниже, если у job'а нет своих.
global:
  # Как часто Prometheus сам ходит и забирает (scrape) метрики у целей из scrape_configs.
  # 15s — стандартная рекомендация самого Prometheus: достаточно часто для графиков,
  # но не настолько, чтобы заметно грузить опрашиваемый сервис.
  scrape_interval: 15s

scrape_configs:
  # job_name — просто метка в самом Prometheus (появится как значение label `job` у всех
  # метрик этой цели) — через неё в Grafana фильтруют "метрики именно этого сервиса".
  - job_name: users

    # Эндпоинт, по которому Prometheus ожидает увидеть метрики в своём текстовом формате.
    # По умолчанию Prometheus ходит на "/metrics" — у Spring Boot Actuator путь другой,
    # поэтому явно переопределяем.
    metrics_path: /actuator/prometheus

    # /actuator/prometheus у :users требует роль ADMIN в JWT — без токена Prometheus
    # получал бы 401/403, и метрики пропали бы. У Prometheus 2.27+ есть встроенная
    # поддержка OAuth2 client-credentials: сам ходит в token_url за токеном, сам
    # обновляет его по истечении срока — без этого блока пришлось бы вручную
    # генерировать и прописывать статический токен, который к тому же протухнет.
    # client_id "prometheus" — confidential-клиент в Keycloak с включённым service
    # account, которому в realm'е назначена роль ADMIN (так же, как администратору-
    # человеку) — для Keycloak это просто ещё один клиент с ролью, не особый случай.
    oauth2:
      client_id: prometheus
      client_secret: prometheus-secret
      # Keycloak — соседний контейнер в той же docker-сети (docker compose создаёт
      # её автоматически и даёт каждому контейнеру имя его сервиса как DNS-имя),
      # поэтому Prometheus обращается к нему по имени сервиса "keycloak" и его
      # родному порту внутри контейнера — 8080. Порт 8180 — это проекция наружу,
      # на хост-машину, она тут ни при чём: изнутри docker-сети Keycloak всегда
      # слушает именно 8080, независимо от того, на какой порт хоста он вынесен.
      token_url: http://keycloak:8080/realms/happynoizzzyrooms/protocol/openid-connect/token

    # Список адресов, которые нужно опрашивать для этого job'а.
    static_configs:
      - targets:
          # ":users" запущен не в контейнере (это обычный `gradlew bootRun` на хосте), а
          # Prometheus живёт внутри docker-сети — значит "localhost" тут означало бы
          # "сам контейнер Prometheus", а не хост-машину. "host.docker.internal" — особое
          # имя, которое Docker резолвит в адрес хоста; на Linux оно не работает само по
          # себе — контейнеру Prometheus нужна явная запись в /etc/hosts, добавленная
          # через ключ `extra_hosts: - "host.docker.internal:host-gateway"` в описании
          # его сервиса в docker-compose.yml (без неё имя просто не резолвится).
          - host.docker.internal:8083

  # Gateway — метрики по маршруту (gateway.requests с тегами routeId/routeUri/
  # httpStatusCode) появляются автоматически, встроенным GatewayMetricsFilter,
  # как только Actuator+Micrometer видны в classpath — в коде Gateway для этого
  # ничего не писали.
  - job_name: gateway
    metrics_path: /actuator/prometheus
    # /actuator/prometheus у :gateway тоже требует роль ADMIN в JWT — тот же
    # service-account клиент Keycloak, что и в job'е users выше, выдаёт токен сам
    # себе через client-credentials и обновляет его по истечении срока.
    oauth2:
      client_id: prometheus
      client_secret: prometheus-secret
      token_url: http://keycloak:8080/realms/happynoizzzyrooms/protocol/openid-connect/token
    static_configs:
      - targets:
          - host.docker.internal:8080
