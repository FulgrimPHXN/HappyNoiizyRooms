services:
  postgres-users:
    image: postgres:18
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
    ports:
      - "5432:5432"
    volumes:
      - postgres-users-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-rooms:
    image: postgres:18
    environment:
      POSTGRES_DB: rooms
      POSTGRES_USER: rooms
      POSTGRES_PASSWORD: rooms
    ports:

      # Отдельный порт хоста для второй базы PostgreSQL.
      - "5433:5432"
    volumes:
      - postgres-rooms-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rooms -d rooms"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:

    image: prom/prometheus:v2.54.1
    volumes:

      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

      - prometheus-data:/prometheus
    ports:

      - "9090:9090"

    # Prometheus обращается к сервисам на хосте, в том числе на Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    ports:

      - "3000:3000"
    volumes:

      - grafana-data:/var/lib/grafana
    environment:

      GF_SECURITY_ADMIN_PASSWORD: grafana

    depends_on:
      - prometheus

volumes:
  postgres-users-data:
  postgres-rooms-data:
  prometheus-data:
  grafana-data:
