services:
  keycloak:
    # аутентификацию и выдачу JWT делает
    # Keycloak (внешний Identity Provider), а каждый сервис проверяет подпись
    # токена сам, по его публичному набору ключей (JWKS). start-dev — встроенное dev-хранилище без отдельной БД:
    image: quay.io/keycloak/keycloak:26.6.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Без этого issuer (claim "iss" в токене) берётся из заголовка Host запроса —
      # т.е. у токена, который Prometheus получает через внутреннюю docker-сеть
      # ("keycloak:8080"), issuer был бы другим, чем у токена, полученного с хоста
      # ("localhost:8180"). :users/:rooms сверяют issuer-uri строго (это один из
      # штатных валидаторов Spring Security OAuth2 Resource Server) — фиксируем
      # issuer одним значением независимо от того, с какой стороны пришёл запрос.
      # Keycloak 26 — провайдер hostname:v2: полный URL в одной переменной, а не
      # отдельные hostname/hostname-port (те — устаревший v1-стиль, в логах
      # предупреждение и порт из них фактически не применяется).
      KC_HOSTNAME: http://localhost:8180
    ports:
      # Отдельный от gateway (8080) порт — клиенты (и сервисы при проверке JWKS)
      # ходят сюда напрямую, не через наш gateway.
      - "8180:8080"
    volumes:
      # Realm/клиент/тестовый пользователь — заводятся автоматически при старте
      # (--import-realm), а не руками через Admin Console.
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  postgres-rooms:
    image: postgres:18
    environment:
      POSTGRES_DB: rooms
      POSTGRES_USER: rooms
      POSTGRES_PASSWORD: rooms
    ports:
      # 5433, не 5432 — чтобы не конфликтовать с возможным локальным Postgres на
      # хосте, который слушает дефолтный 5432. Внутри контейнера порт всё равно
      # родной 5432 — меняется только то, как этот порт виден снаружи контейнера.
      - "5433:5432"
    volumes:
      - postgres-rooms-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rooms -d rooms"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    # Пинним конкретную версию, а не latest — чтобы обновление образа не подсовывало
    # тихо несовместимый формат конфига в день, когда никто не планировал этим заниматься.
    image: prom/prometheus:v2.54.1
    volumes:
      # Сам конфиг (какие цели опрашивать) — читаем с хоста как read-only: Prometheus его
      # не должен и не умеет менять сам, правим только руками на хосте.
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Накопленная история метрик (TSDB) — именованный том, чтобы не терялась
      # при `docker compose down` (но терялась бы при `down -v`, как и Postgres-данные).
      - prometheus-data:/prometheus
    ports:
      # Веб-UI/API самого Prometheus (его собственный встроенный график-обзреватель,
      # отдельно от Grafana) — удобно для быстрой проверки "видит ли Prometheus цель живой".
      - "9090:9090"
    # На Linux (в отличие от Docker Desktop на Mac/Windows) "host.docker.internal" не
    # резолвится из коробки — "host-gateway" — служебное значение, которое docker compose
    # сам подставляет вместо него реальным IP хоста при старте контейнера.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      # Веб-UI Grafana — порт, который открываете в браузере.
      - "3000:3000"
    volumes:
      # Дашборды/настройки/источники данных, которые вы сохраните через UI — без тома
      # все они живут только в слое контейнера и исчезают при `docker compose down`.
      - grafana-data:/var/lib/grafana
    environment:
      # Простой пароль для локальной разработки: сервис не торчит дальше localhost,
      # так что секрет-менеджер здесь не даёт реальной защиты, только лишнюю возню.
      GF_SECURITY_ADMIN_PASSWORD: grafana
    # Не обязательно для работы (Grafana подключится к Prometheus по требованию, когда
    # реально понадобится), но этот порядок старта логичнее читается в выводе `docker compose up`.
    depends_on:
      - prometheus

volumes:
  postgres-rooms-data:
  prometheus-data:
  grafana-data:
