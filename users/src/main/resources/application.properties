server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/users
spring.datasource.username=users
spring.datasource.password=users

spring.jpa.hibernate.ddl-auto=validate

# Почти все запросы этого сервиса (включая каждый аутентифицированный запрос —
# JwtAuthenticationFilter ходит в БД за пользователем на каждый из них) бьют в Postgres,
# так что реальный потолок параллельности задаёт пул соединений, а не пул Tomcat-потоков.
# Fixed-size пул (min == max) — рекомендация самого HikariCP: предсказуемое поведение
# под нагрузкой вместо динамического роста/сжатия пула.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10

# Запас на то, что часть запросов не достаёт до БД вовсе (permitAll-эндпоинты, отказ
# валидации до обращения к сервису) — но без смысла раздувать сильно сверх пула
# соединений: лишние потоки просто будут простаивать в очереди за свободным соединением.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5

app.jwt.secret=v2YSr9p15LCrvF1ftR8X7mC0jfWSdy8nOk95s6WZAvI=
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=1209600000

management.endpoints.web.exposure.include=health,metrics,prometheus
# По умолчанию выключена ради производительности — без неё биндер метрик Tomcat
# (tomcat.threads.*) не регистрируется вообще, пула-потоков в /actuator/metrics не увидеть.
server.tomcat.mbeanregistry.enabled=true
