server.port=8083

# Keycloak — единственный эмитент токенов. :users (как и :rooms/:gateway отдельно от
# него) только проверяет подпись по его JWKS; Spring Security сам находит JWKS через
# OIDC-discovery по этому issuer-uri (/.well-known/openid-configuration).
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/happynoizzzyrooms

management.endpoints.web.exposure.include=health,metrics,prometheus
# По умолчанию выключена ради производительности — без неё биндер метрик Tomcat
# (tomcat.threads.*) не регистрируется вообще, пула-потоков в /actuator/metrics не увидеть.
server.tomcat.mbeanregistry.enabled=true
